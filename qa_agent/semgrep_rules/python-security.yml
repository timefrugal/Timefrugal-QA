rules:
  - id: subprocess-shell-true
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
    message: >
      subprocess called with shell=True — vulnerable to shell injection if any argument contains
      user-controlled input. Pass a list of arguments and remove shell=True.
    severity: WARNING
    languages: [python]
    metadata:
      category: security

  - id: eval-use
    pattern: eval(...)
    message: >
      eval() executes arbitrary Python. Avoid entirely or strictly validate and sandbox input.
    severity: ERROR
    languages: [python]
    metadata:
      category: security

  - id: exec-use
    pattern: exec(...)
    message: >
      exec() executes arbitrary Python. Avoid entirely or strictly validate and sandbox input.
    severity: ERROR
    languages: [python]
    metadata:
      category: security

  - id: pickle-deserialize
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
    message: >
      pickle deserialisation executes arbitrary code. Never unpickle data from untrusted sources.
      Use JSON or a safe serialisation format instead.
    severity: ERROR
    languages: [python]
    metadata:
      category: security

  - id: requests-no-timeout
    patterns:
      - pattern: requests.$METHOD(...)
      - pattern-not: requests.$METHOD(..., timeout=..., ...)
    message: >
      requests.$METHOD called without a timeout — will hang indefinitely on slow or unresponsive
      servers. Add timeout=<seconds>.
    severity: WARNING
    languages: [python]
    metadata:
      category: reliability

  - id: hardcoded-secret
    patterns:
      - pattern: $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apikey|token|auth_token|access_token|private_key|credential)
      - pattern-not: $VAR = ""
    message: >
      Possible hardcoded secret in '$VAR'. Use environment variables or a secrets manager
      (e.g. os.getenv("SECRET_NAME")) instead.
    severity: ERROR
    languages: [python]
    metadata:
      category: security

  # Known limitations: (1) sanitizes on bare .resolve() without requiring a following
  # is_relative_to() containment check, so "resolve() with no containment check at all" is a
  # false negative by design (chosen to avoid false-positiving the correct fix pattern); (2) it's
  # intraprocedural only (OSS semgrep limitation) — a join done in one function and used
  # unsafely in a different function without a local check won't be caught.
  - id: unresolved-base-dir-path-join
    mode: taint
    languages: [python]
    severity: ERROR
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $BASE / $SEG
              - pattern: os.path.join($BASE, $SEG)
          # $BASE must still *look* like a base directory: this rule keys on naming
          # convention on purpose rather than firing on every `/` join. Three accepted
          # shapes: (1) an ALL-CAPS constant, optionally module-private or dotted
          # (CACHE_DIR, _SPOOL, kext.QUARANTINE); (2) an identifier or attribute chain
          # whose last component ends in a dir/root/path/folder word (root, skills_dir,
          # self.dir, self.spool_root, baseDir); (3) a subscript whose string key ends
          # in one (cfg["proposals_dir"], config["paths"]["spool_root"]).
          # The original ^[A-Z][A-Z0-9_]*$ matched only shape (1) and missed ~80% of
          # real join sites (jarvis-infra #407).
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(?:(?:[\w.]*\.)?_?[A-Z][A-Z0-9_]*|[\w.]*(?:\[[^\]]*\])*(?:\[\s*["']\w*)?(?:dir|root|path|folder|Dir|Root|Path|Folder)s?(?:["']\s*\])?(?:\(\))?)$
          - metavariable-regex:
              metavariable: $SEG
              regex: ^(?![frbuFRBU]{0,3}["']).*$
    pattern-sanitizers:
      # NOTE: abspath/realpath on their own only *normalize* a path, they do not
      # prove containment. They are accepted here (as abspath already was) because
      # every correct containment guard in practice starts with one of them and then
      # prefix-compares; treating them as sanitizers deliberately trades a few false
      # negatives for a much lower false positive rate on code that does check.
      - pattern: $X.resolve()
      - pattern: $X.is_relative_to(...)
      - pattern: os.path.abspath(...)
      - pattern: os.path.realpath(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $SINK.exists()
              - pattern: $SINK.read_text(...)
              - pattern: $SINK.write_text(...)
              - pattern: $SINK.read_bytes(...)
              - pattern: $SINK.write_bytes(...)
              - pattern: $SINK.open(...)
              - pattern: $SINK.glob(...)
              - pattern: $SINK.rglob(...)
              - pattern: $SINK.unlink(...)
              - pattern: $SINK.mkdir(...)
              - pattern: open($SINK, ...)
              - pattern: os.makedirs($SINK, ...)
              - pattern: os.remove($SINK, ...)
              - pattern: os.rename($SINK, ...)
              - pattern: os.rename(..., $SINK)
              - pattern: os.replace($SINK, ...)
              - pattern: os.replace(..., $SINK)
              - pattern: shutil.copyfile($SINK, ...)
              - pattern: shutil.copyfile(..., $SINK)
              - pattern: glob.glob($SINK, ...)
          - focus-metavariable: $SINK
    message: >
      A filesystem path was built by joining a base-directory-looking variable (e.g. CACHE_DIR, skills_dir, self.spool_root, cfg["proposals_dir"])
      with another value via the `/` operator or os.path.join(), then used for a filesystem
      read/write/exists/glob/open operation without first resolving it and verifying containment
      (.resolve() + is_relative_to(), or an equivalent prefix check). pathlib's `/` operator (and
      os.path.join) silently discard the base directory entirely if the joined segment is an
      absolute path, and a ".." substring check does not catch that -- this can allow arbitrary
      file read or write outside the intended directory. Resolve the joined path and verify it is
      still contained within the base directory (e.g. resolved.is_relative_to(BASE.resolve()))
      before using it.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      references:
        - https://cwe.mitre.org/data/definitions/22.html
